<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanPro</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>
    <main>
        <nav>
            <div id="nav-logo"><img src="./Assets/logo.webp" alt=""></div>

            <div id="nav-mid">
                <a href="">Services<i class="ri-arrow-down-s-fill"></i></a>
                <a href="">Help</a>
                <a href="">Pricing<i class="ri-arrow-down-s-fill"></i></a>
                <a href="">Recyclers</a>
            </div>

            <div id="nav-right">
                <div id="nav-right-inner">
                    <p>Get the App</p>
                    <img src="./Assets/playstore.png" alt="">
                </div>
            </div>
        </nav>

        <section>
            <div id="comments">
                <div id="comment-1"><p>Tough stains? We'll make your clothes flawless!</p></div>
                <div id="comment-2"><p>We'll Handle Any Stain - Guranteed Removal</p></div>
            </div>

            <div id="shirt-img">
                <img src="./Assets/shirt.png" alt="">
            </div>

            <div id="star-left">
                <img src="./Assets/star.webp" alt="" class="star">
                <img src="./Assets/star.webp" alt="" class="star">
                <img src="./Assets/star.webp" alt="" class="star">
                <img src="./Assets/star.webp" alt="" class="star">
                <img src="./Assets/star.webp" alt="" class="star">
            </div>

            <div id="main-txt">
                <div class="text-over">
                    <p>The New</p>
                </div>

                <div id="text-under">
                    <p>Level of care for Your</p>
                </div>

                <div class="text-over">
                    <p>Wardrobe</p>
                </div>
            </div>

            <div id="right-card">
                <img src="./Assets/clothes-pile.webp" alt="">
                <h1>2.7k+</h1>
                <p>Just Trust Us — We'll Take Care of it</p>
            </div>
        </section>

        <footer>
            <div id="btm-left">
                <div class="profile-pic" id="img-1">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Avatar" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">
                </div>
                <div class="profile-pic" id="img-2">
                    <img src="https://randomuser.me/api/portraits/men/18.jpg" alt="User Avatar" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">
                </div>
                <div class="profile-pic" id="img-3">
                    <img src="https://randomuser.me/api/portraits/women/21.jpg" alt="User Avatar" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">
                </div>
                <div class="profile-pic" id="img-4">
                    <img src="https://randomuser.me/api/portraits/women/24.jpg" alt="User Avatar" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">
                </div>
                <div class="profile-pic" id="img-5">
                    <img src="https://randomuser.me/api/portraits/men/27.jpg" alt="User Avatar" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">
                </div>
                <h3>5k+</h3>
            </div>

            <div id="btm-right">
                <button>Reserve Service <i class="ri-arrow-right-up-line"></i></button>
            </div>
        </footer>
    </main>
</body>
</html>
